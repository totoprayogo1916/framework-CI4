name: Auto Comment Conflicts

on:
  # schedule:
    # - cron: '0 0 * * *'
  pull_request:
  #   branches:
  #     - 'develop'
  #     - '4.*'
    # types:
    #   - labeled

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
    contents: read
    pull-requests: write

jobs:
  auto-comment-conflict:
    runs-on: ubuntu-latest
    steps:
      - name: Get All PR
        id: list-pr
        run: echo "list={{gh pr list --json mergeable}}" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: ${{ toJSON(steps.list-pr.outputs.list) }}

