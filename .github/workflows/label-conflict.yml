name: Auto Comment Conflicts

on:
  push:
    branches:
      - 'develop'
      - '4.**'

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  auto-check-conflict:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get PR List
        run: |
          gh pr list -L 100 --json mergeable,url,labels,author > pr_list.json

      - name: 'Add label "stale" and comment'
        run: |

          for pr in $(echo "pr_list.json" | jq -c '.[]'); do
            # number=$(echo "$pr" | jq -r '.number')
            author=$(echo "$pr" | jq -r '.author.login')
            mergeable=$(echo "$pr" | jq -r '.mergeable')
            labels=$(echo "$pr" | jq -c '.labels[].name' | tr -d '[]"')

            if [ "$mergeable" == "CONFLICTING" ] && [[ ! "$labels" == *"stale"* ]]; then
              url=$(echo "$pr" | jq -r '.url')
              # gh pr edit $number --body "Automated action performed"
              echo "$url by $author"
            fi
          done

          # for item in $(cat pr_list.json | jq -r '.[] | @base64'); do
