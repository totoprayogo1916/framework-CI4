name: Auto Comment Conflicts

on:
  # schedule:
    # - cron: '0 0 * * *'
  pull_request:
  #   branches:
  #     - 'develop'
  #     - '4.*'
    # types:
    #   - labeled

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
    contents: read
    pull-requests: write

jobs:
  auto-comment-conflict:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: getPR
        run: |
          echo $(gh pr list -L 100 --json number,mergeable,url) > input.json

          # Loop through the JSON array
          for item in $(cat input.json | jq -r '.[] | @base64'); do
            decoded=$(echo $item | base64 --decode)
            mergeable=$(echo $decoded | jq -r '.mergeable')
            number=$(echo $decoded | jq -r '.number')
            url=$(echo $decoded | jq -r '.url')

            echo "PR $number is $mergeable. URL: $url"
          done
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: echo ${{ toJson(steps.getPR.outputs.list) }}

      # - name: Add comment for PR with conflict
