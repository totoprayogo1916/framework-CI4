name: Auto Comment Conflicts

on:
  # schedule:
    # - cron: '0 0 * * *'
  pull_request:
  #   branches:
  #     - 'develop'
  #     - '4.*'
    # types:
    #   - labeled

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
    contents: read
    pull-requests: write

jobs:
  get-pr:
    runs-on: ubuntu-22.04
    outputs:
      PRs: ${{ steps.getPR.outputs.PRsList }}

    steps:
      - id: getPR
        run:
          echo "PRsList=sdsd" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ github.token }}

  auto-comment-conflict:
    runs-on: ubuntu-20.04
    needs: get-pr
    steps:

      - run: echo ${{ toJson(needs.get-pr.outputs.PRs) }}

