name: Auto Comment Conflicts

on:
  # schedule:
    # - cron: '0 0 * * *'
  pull_request:
  #   branches:
  #     - 'develop'
  #     - '4.*'
    # types:
    #   - labeled

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
    contents: read
    pull-requests: write

jobs:
  auto-comment-conflict:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: getPR
        run: |
          PR_LIST=$(gh pr list -L 100 --json number,mergeable,url)
          echo "list=$PR_LIST" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: echo ${{ toJson(steps.getPR.outputs.list) }}

